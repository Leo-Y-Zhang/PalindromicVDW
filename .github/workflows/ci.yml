name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # pdw/verify_all.py IS the gate, and it needs no solver. It compares the
  # progression enumerator against a closed form it did not come from, makes the
  # witness checker catch a planted progression and then miss it once the
  # sequence is broken, re-derives the first six published pairs by exhaustion
  # over all palindromic colourings, and re-verifies every stored witness before
  # flipping a character to confirm the check can still fail. About six seconds.
  #
  # What CI deliberately does NOT do is re-run the SAT measurements. Those are
  # the timings in PREFLIGHT.md, they take hours, and their point is that they
  # ran out - repeating them on a shared runner would measure the runner.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python pdw/verify_all.py

  # Pinned to the version ruff.toml was validated against.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install ruff==0.16.1
      - run: ruff check .

  # The binary directly rather than gitleaks-action, and the whole history
  # rather than a diff. The action scans the range <before>^..<after>, which has
  # no meaning on the first push of a repository -- the parent of the root
  # commit does not exist, so it fails with "unknown revision" and reports a
  # partial scan of zero bytes. A secret gate that cannot run on the commit that
  # creates the repository is the wrong shape. This scans every commit, every
  # time, and matches the version run locally before pushing.
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - run: gitleaks detect --source . --redact --exit-code 1 --log-opts=--all
